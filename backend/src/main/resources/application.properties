spring.application.name=pet-cuidar-backend
server.port=8080

# Banco SQLite (arquivo local petcuidar.db na raiz do backend)
spring.datasource.url=jdbc:sqlite:petcuidar.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.agenda.time-zone=${AGENDA_TIME_ZONE:America/Recife}

# Timeout para chamadas de IA (ms) - usado pelos services de integracao
ia.timeout-ms=5000
# Provedor de texto: simulator (padrao local, sem credenciais) ou openai.
ia.provider=${IA_PROVIDER:simulator}
ia.base-url=${LLM_BASE_URL:https://api.openai.com/v1}
ia.api-key=${LLM_API_KEY:}
ia.model=${LLM_MODEL:gpt-4o-mini}
# Numero de falhas seguidas ate abrir o "circuit breaker" simplificado
ia.circuit-breaker.max-falhas=3
# Janela (ms) que o circuito fica aberto apos atingir o max de falhas
ia.circuit-breaker.reset-ms=30000

# Microservico Python de predicao de no-show
noshow.predictor.base-url=${NOSHOW_PREDICTOR_BASE_URL:http://localhost:8000}
noshow.predictor.timeout-ms=${NOSHOW_PREDICTOR_TIMEOUT_MS:5000}

# Provedor de texto dos lembretes (PC-030): simulador (padrao, sem credenciais) ou anthropic.
# A chave NUNCA deve ser escrita aqui: defina a variavel de ambiente LLM_API_KEY.
ia.llm.provider=${LLM_PROVIDER:simulador}
ia.llm.api-key=${LLM_API_KEY:}
ia.llm.model=${LLM_MODEL:claude-opus-5-5}
ia.llm.base-url=${LLM_BASE_URL:https://api.anthropic.com}
ia.llm.max-tokens=${LLM_MAX_TOKENS:2048}
ia.llm.effort=${LLM_EFFORT:low}

# Nome da clinica usado na assinatura dos lembretes
lembrete.nome-clinica=Pet Cuidar

# Tolerancia configuravel antes de marcar uma consulta como nao compareceu.
consulta.tolerancia-nao-comparecimento-minutos=0

# CORS - origem do front-end em desenvolvimento
app.cors.allowed-origin=http://localhost:3000

# E-mail: local apenas simula o envio e nao realiza chamadas externas.
email.provider=${EMAIL_PROVIDER:local}
email.from=${EMAIL_FROM:no-reply@petcuidar.local}
email.subject=${EMAIL_SUBJECT:Lembrete da consulta do seu pet}
email.retry.max-attempts=${EMAIL_MAX_ATTEMPTS:3}
email.retry.initial-backoff-ms=${EMAIL_INITIAL_BACKOFF_MS:250}
email.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}
email.resend.api-key=${RESEND_API_KEY:}

# Job externo fica desabilitado por padrao para o simulador local nunca marcar
# como entregue um e-mail que nao saiu. Habilite junto do provedor real.
lembrete.job.enabled=${LEMBRETE_JOB_ENABLED:false}
lembrete.job.antecedencia-horas=${LEMBRETE_ANTECEDENCIA_HORAS:24}
lembrete.job.janela-minutos=${LEMBRETE_JANELA_MINUTOS:5}
lembrete.job.interval-ms=${LEMBRETE_JOB_INTERVAL_MS:60000}
lembrete.job.initial-delay-ms=${LEMBRETE_JOB_INITIAL_DELAY_MS:10000}
lembrete.job.time-zone=${LEMBRETE_TIME_ZONE:America/Recife}
