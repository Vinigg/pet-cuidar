spring.application.name=pet-cuidar-backend
server.port=8080

# Banco SQLite (arquivo local petcuidar.db na raiz do backend)
spring.datasource.url=jdbc:sqlite:petcuidar.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Timeout para chamadas de IA (ms) - usado pelos services de integracao
ia.timeout-ms=5000
# Numero de falhas seguidas ate abrir o "circuit breaker" simplificado
ia.circuit-breaker.max-falhas=3
# Janela (ms) que o circuito fica aberto apos atingir o max de falhas
ia.circuit-breaker.reset-ms=30000

# Tolerancia configuravel antes de marcar uma consulta como nao compareceu.
consulta.tolerancia-nao-comparecimento-minutos=0

# CORS - origem do front-end em desenvolvimento
app.cors.allowed-origin=http://localhost:3000
