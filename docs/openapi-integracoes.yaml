openapi: 3.0.3
info:
  title: Pet Cuidar - Integrações IA
  version: 1.0.0
  description: Contrato dos endpoints sob responsabilidade da frente de integrações.
paths:
  /consultas/{id}/lembrete:
    post:
      summary: Gera, valida e envia um lembrete idempotente
      parameters:
        - $ref: '#/components/parameters/ConsultaId'
      responses:
        '200':
          description: Estado atual do lembrete; repetição não envia outro e-mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lembrete'
        '400':
          description: Consulta cancelada
        '404':
          description: Consulta inexistente
  /consultas/{id}/predicao-no-show:
    get:
      summary: Obtém e persiste uma predição válida de no-show
      parameters:
        - $ref: '#/components/parameters/ConsultaId'
      responses:
        '200':
          description: Predição explicável ou indisponibilidade explícita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Predicao'
        '404':
          description: Consulta inexistente
  /pets/{id}/historico/resumo:
    get:
      summary: Resume o histórico preservando itens críticos por regra fixa
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Resumo validado e link para o histórico completo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoHistorico'
        '404':
          description: Pet inexistente
components:
  parameters:
    ConsultaId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Lembrete:
      type: object
      required: [status, textoEnviado, usouFallback, tentativas]
      properties:
        status:
          type: string
          enum: [PENDENTE, ENVIADO, FALHOU]
        textoEnviado:
          type: string
        usouFallback:
          type: boolean
        tentativas:
          type: integer
        ultimoErro:
          type: string
          nullable: true
    Predicao:
      type: object
      required: [categoria, motivo]
      properties:
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          nullable: true
        categoria:
          type: string
          enum: [BAIXO, MEDIO, ALTO, INDISPONIVEL]
        motivo:
          type: string
        dataCalculo:
          type: string
          format: date-time
          nullable: true
    ResumoHistorico:
      type: object
      required: [resumo, itensCriticos, linkHistoricoCompleto, usouFallback]
      properties:
        resumo:
          type: string
        itensCriticos:
          type: string
        linkHistoricoCompleto:
          type: string
        usouFallback:
          type: boolean
