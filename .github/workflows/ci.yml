name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: "true"
      - run: npm run build

  prediction-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservico-predicao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: microservico-predicao/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run prediction service tests
        run: python -m pytest
      - name: Validate module and prediction contract
        run: |
          python -m compileall -q app
          python - <<'PY'
          from app.main import PredicaoRequest, health, predict

          status = health()
          response = predict(PredicaoRequest(
              consultas_anteriores=4,
              faltas_anteriores=1,
              dias_antecedencia=7,
              periodo=1,
              ja_confirmou_antes=0,
              idade_pet=3,
          ))

          assert status["status"] == "ok"
          assert 0.0 <= response.score <= 1.0
          assert response.categoria in {"BAIXO", "MEDIO", "ALTO"}
          assert response.motivo
          PY
